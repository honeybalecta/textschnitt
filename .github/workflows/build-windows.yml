name: Windows-Installer bauen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer (leer = packaging/app-version.txt)"
        required: false
        default: ""
      models:
        description: "Mitgelieferte Whisper-Modelle (Leerzeichen-getrennt)"
        required: true
        default: "small"
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["textschnitt.py", "textschnitt_app.py", "core/**", "packaging/**", "requirements.txt", ".github/workflows/build-windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TS_VERSION_INPUT: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      TS_MODELS: ${{ github.event.inputs.models || 'small' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:TS_VERSION_INPUT) { $env:TS_VERSION_INPUT } else { (Get-Content packaging/app-version.txt -Raw).Trim() }
          "TS_VERSION=$($v.TrimStart('v'))" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt huggingface_hub

      # PyInstaller mit selbst übersetztem Startprogramm (Bootloader): Die mitgelieferten Bootloader stecken in
      # unzähligen Programmen – auch in Schadsoftware – und lösen deshalb oft Fehlalarme von Virenscannern aus.
      - name: PyInstaller mit eigenem Bootloader bauen
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-binary pyinstaller "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.9"
          python -c "import PyInstaller, os; p = os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel'); print(p); print(os.listdir(p))"


      - name: ffmpeg holen
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build\ffmpeg
          Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Include LICENSE* | Select-Object -First 1 | Copy-Item -Destination build\ffmpeg\LICENSE-ffmpeg.txt
          build\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Whisper-Modelle holen
        shell: pwsh
        run: |
          foreach ($m in $env:TS_MODELS.Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            $repo = if ($m -eq "large-v3-turbo") { "mobiuslabsgmbh/faster-whisper-large-v3-turbo" } else { "Systran/faster-whisper-$m" }
            python -c "from huggingface_hub import snapshot_download; snapshot_download('$repo', local_dir='build/models/$m')"
            Remove-Item -Recurse -Force "build/models/$m/.cache" -ErrorAction SilentlyContinue
            Get-ChildItem "build/models/$m"
          }
          # Modell zum automatischen Freistellen (Robust Video Matting, ca. 15 MB) gleich mitliefern
          Invoke-WebRequest "https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx" -OutFile build/models/rvm_mobilenetv3_fp32.onnx
          Get-ChildItem build/models

      - name: Übersetzungsmodell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: build/models/opus-mt-de-en
          key: opus-mt-de-en-ct2-int8-v1

      - name: Übersetzungsmodell (OPUS-MT Deutsch → Englisch) umwandeln
        shell: pwsh
        run: |
          if (Test-Path build/models/opus-mt-de-en/model.bin) { Get-ChildItem build/models/opus-mt-de-en; exit 0 }
          # eigene Umgebung, damit torch/transformers nicht im Installer landen
          python -m venv "$env:RUNNER_TEMP\conv"
          & "$env:RUNNER_TEMP\conv\Scripts\python.exe" -m pip install --quiet --upgrade pip
          & "$env:RUNNER_TEMP\conv\Scripts\python.exe" -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          & "$env:RUNNER_TEMP\conv\Scripts\python.exe" -m pip install --quiet ctranslate2 "transformers<5" sentencepiece sacremoses
          & "$env:RUNNER_TEMP\conv\Scripts\ct2-transformers-converter.exe" --model Helsinki-NLP/opus-mt-de-en --quantization int8 --output_dir build/models/opus-mt-de-en --copy_files source.spm target.spm
          Get-ChildItem build/models/opus-mt-de-en
          if (-not (Test-Path build/models/opus-mt-de-en/model.bin)) { throw "Umwandlung fehlgeschlagen" }

      - name: App bauen (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/textschnitt.spec 2>&1 | Tee-Object -FilePath build.log
          if (-not (Test-Path dist\HoneyCut\HoneyCut.exe)) { throw "PyInstaller hat keine EXE erzeugt" }

      - name: Selbsttest der gebauten App
        shell: pwsh
        run: |
          $p = Start-Process dist\HoneyCut\HoneyCut.exe -ArgumentList "--selftest", "$pwd\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Virenscan mit Microsoft Defender
        shell: pwsh
        run: |
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $mp) { $mp = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ErrorAction SilentlyContinue }
          if (-not $mp) { Write-Host "Defender nicht verfügbar – Scan übersprungen"; exit 0 }
          & $mp.FullName -SignatureUpdate | Out-Host
          $bad = $false
          foreach ($f in @("dist\HoneyCut\HoneyCut.exe") + (Get-ChildItem dist\HoneyCut-Setup-*.exe | ForEach-Object FullName)) {
            $full = (Resolve-Path $f).Path
            $out = & $mp.FullName -Scan -ScanType 3 -File $full -DisableRemediation 2>&1 | Out-String
            Write-Host "== $full`n$out"
            if ($LASTEXITCODE -eq 2 -or $out -match "Threat\s") { $bad = $true }
          }
          if ($bad) { throw "Defender meldet eine Bedrohung – Release wird nicht veröffentlicht" }

      - name: Installer als Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:TS_VERSION.StartsWith("v")) { $env:TS_VERSION } else { "v$env:TS_VERSION" }
          $file = (Get-ChildItem dist\HoneyCut-Setup-*.exe | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $file --clobber }
          else { gh release create $tag $file --title "HoneyCut $tag" --notes "Windows-Installer. Mitgelieferte Modelle: $env:TS_MODELS" }

      - name: Fehlerbericht als Commit-Kommentar
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = @("### Windows-Build fehlgeschlagen", '```')
          if (Test-Path selftest.json) { $r += Get-Content selftest.json }
          if (Test-Path build.log) { $r += (Get-Content build.log | Select-String -Pattern "Error|error:|Traceback|not found|failed" | Select-Object -Last 40 | ForEach-Object { $_.Line }) ; $r += "----- letzte Zeilen -----"; $r += (Get-Content build.log -Tail 30) }
          $r += '```'
          $r -join "`n" | Out-File -Encoding utf8 report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md | Out-Null
