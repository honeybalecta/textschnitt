name: Diagnose Schrift im Export (Windows, neuer Stand)

# Nur auf dem Testzweig. Veröffentlicht nichts. Die App wird wie für den Installer gebaut (ohne Modelle) und gestartet;
# geprüft werden die Schriftprobe des Selbsttests und der Vergleich Vorschau ↔ Export am fertigen Bild.
# Das Ergebnis wird als Dateien in diesen Zweig geschrieben (diag4/).
on:
  push:
    branches: [diag-schrift-windows]
    paths: ["tests/diag_wys.py", "tests/diag_wys.mjs", "tests/diag_wys.json", "tests/diag_probe.py", "textschnitt.py", "packaging/app_entry.py", ".github/workflows/diag-app.yml"]

permissions:
  contents: write

jobs:
  neu:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow numpy

      - name: PyInstaller mit eigenem Bootloader bauen
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.9"

      - name: ffmpeg holen
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build\ffmpeg

      - name: App bauen (PyInstaller, ohne Modelle)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/textschnitt.spec 2>&1 | Select-Object -Last 3
          if (-not (Test-Path dist\HoneyCut\HoneyCut.exe)) { throw "PyInstaller hat keine EXE erzeugt" }

      - name: Browser-Steuerung
        shell: pwsh
        run: npm install --no-save --silent playwright-core

      - name: Diagnose
        shell: pwsh
        run: python tests\diag_wys.py

      - name: Ergebnis in den Zweig schreiben
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag4
          git commit -m "Diagnose: Ergebnis des neuen Stands unter Windows"
          git pull --rebase origin diag-schrift-windows
          git push origin HEAD:diag-schrift-windows
