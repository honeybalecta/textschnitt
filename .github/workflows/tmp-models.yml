name: Modelle zwischenlagern (temporär)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stash:
    runs-on: ubuntu-latest
    steps:
      - name: Modelle holen und in Zweig tmp-models ablegen
        run: |
          mkdir m && cd m
          curl -sL --fail -o ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          curl -sL --fail -o ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          split -b 90m ggml-small-q5_1.bin ggml-small-q5_1.bin.part- && rm ggml-small-q5_1.bin
          ls -la
          git init -q && git checkout -q -b tmp-models
          git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git add . && git commit -q -m "temporäre Modellablage"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-models
